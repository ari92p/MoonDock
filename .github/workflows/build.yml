name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check localization keys
        run: ./scripts/check-strings.sh
      - name: Build (ad-hoc signed)
        run: ./scripts/build.sh
